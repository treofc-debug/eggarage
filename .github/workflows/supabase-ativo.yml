# Mantém o projeto do Supabase (plano grátis) ativo.
# O Supabase pausa projetos grátis após 7 dias sem uso; esta tarefa faz uma
# consulta simples no banco a cada 3 dias. A consulta é anônima: por causa das
# regras de segurança (RLS) ela não lê nenhum dado, só "acorda" o banco.
#
# O GitHub desliga tarefas agendadas de repositórios sem nenhum commit por 60 dias.
# Por isso, uma vez por mês (dia 1) ela também grava um commit vazio.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch:          # botão "Run workflow" para testar na hora

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o banco do Supabase
        env:
          SUPA_URL: https://edgugieuxckhqyxodmwa.supabase.co
          SUPA_KEY: sb_publishable_OBfPger_A8S16jMk-vNEpg_V7T_Rm3M   # chave pública (a mesma do config.js)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPA_URL/rest/v1/ordens?select=id&limit=1" -H "apikey: $SUPA_KEY")
          echo "Supabase respondeu: HTTP $code"
          test "$code" = "200"

      - name: Commit mensal para o GitHub não desligar o agendamento
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" != "01" ]; then echo "Hoje não é dia 1, nada a fazer."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Manter agendamento ativo"
          git push
